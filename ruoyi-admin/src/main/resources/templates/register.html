<!DOCTYPE html>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>注册智域大脑</title>
    <meta name="description" content="智域大脑智力训练平台">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <link href="../static/ruoyi/css/ry-ui.css" th:href="@{/ruoyi/css/ry-ui.css?v=4.8.3}" rel="stylesheet"/>
    <!-- 360浏览器急速模式 -->
    <meta name="renderer" content="webkit">
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}"/>
    <style type="text/css">label.error { position:inherit;  }</style>
</head>
<body class="signin">
    <div class="signinpanel">
        <div class="row">
            <div class="col-sm-7">
                <div class="signin-info">
                    <div class="logopanel m-b">
                        <h1><i class="fa fa-bolt" style="color:#4e6ef2;"></i> 智域大脑</h1>
                    </div>
                    <div class="m-b"></div>
                    <h4>欢迎加入 <strong>智域大脑 智力训练平台</strong></h4>
                    <ul class="m-b">
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 记忆力训练</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 专注力训练</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 逻辑力训练</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> 反应力训练</li>
                    </ul>
                    <strong>已经注册过? <a th:href="@{/login}">直接登录&raquo;</a></strong>
                </div>
            </div>
            <div class="col-sm-5">
                <form id="registerForm" autocomplete="off">
                    <h4 class="no-margins">注册：</h4>
                    <p class="m-t-md">用邮箱注册，每天10分钟提升脑力</p>
                    <input type="text"     name="username" class="form-control uname"         placeholder="用户名"   maxlength="20" />
                    <input type="text"     name="email"    class="form-control"               placeholder="邮箱"     maxlength="50" />
                    <div class="row m-t">
                        <div class="col-xs-6" style="padding-right:2px;">
                            <input type="text" name="emailCode" class="form-control"  placeholder="邮箱验证码" maxlength="6" >
                        </div>
                        <div class="col-xs-6" style="padding-left:2px;">
                            <button type="button" class="btn btn-block btn-outline btn-info" id="btnSendCode" data-loading="发送中...">获取验证码</button>
                        </div>
                    </div>
                    <input type="password" name="password" class="form-control pword"         placeholder="口令(密码)" maxlength="20" />
                    <input type="password" name="confirmPassword" class="form-control pword"  placeholder="确认口令" maxlength="20" />
                    <div class="checkbox-custom m-t">
				        <input type="checkbox" id="acceptTerm" name="acceptTerm"> <label for="acceptTerm">我已阅读并同意</label>
				        <a th:href="@{/index}" target="_blank">使用条款</a>
				    </div>
                    <button class="btn btn-success btn-block" id="btnSubmit" data-loading="正在验证注册，请稍候...">注册</button>
                </form>
            </div>
        </div>
        <div class="signup-footer">
            <div class="pull-left">
                &copy; 2018-2026 All Rights Reserved. 智域大脑 <br>
            </div>
        </div>
    </div>
<script th:inline="javascript"> var ctx = [[@{/}]];</script>
<!-- 全局js -->
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
<script src="../static/ajax/libs/validate/jquery.validate.extend.js" th:src="@{/ajax/libs/validate/jquery.validate.extend.js}"></script>
<script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script src="../static/ruoyi/js/ry-ui.js" th:src="@{/ruoyi/js/ry-ui.js?v=4.8.3}"></script>
<script src="../static/ruoyi/register.js" th:src="@{/ruoyi/register.js}"></script>
</body>
</html>
